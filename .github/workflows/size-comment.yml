name: Size Report (Comment)

on:
  workflow_run:
    workflows: [Size Report (Compute)]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Publish size comment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download size report
        uses: actions/download-artifact@v4
        with:
          name: size-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/size-report

      - name: Publish PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          set -euo pipefail

          if [ -f /tmp/size-report/size-report.md ]; then
            REPORT=/tmp/size-report/size-report.md
          else
            REPORT=$(find /tmp/size-report -name 'size-report.md' | head -n1 || true)
          fi

          if [ -z "${REPORT}" ] || [ ! -f "${REPORT}" ]; then
            echo "ERROR: size-report.md not found"
            find /tmp/size-report -type f
            exit 1
          fi

          PR_NUMBER="${EVENT_PR_NUMBER:-}"
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            PR_NUMBER=$(sed -n 's/.*<!-- pr-number:\([0-9][0-9]*\) -->.*/\1/p' "${REPORT}" | head -n1 || true)
          fi

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            PR_NUMBER=$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" \
              --jq '.[0].number // empty')
          fi

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "ERROR: unable to resolve PR number for ${HEAD_SHA}"
            exit 1
          fi

          echo "REPOSITORY=${REPOSITORY}"
          echo "PR_NUMBER=${PR_NUMBER}"
          echo "HEAD_SHA=${HEAD_SHA}"
          echo "REPORT=${REPORT}"

          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select((.body // "") | contains("<!-- size-report -->")) | .id' \
            | head -n1 || true)

          if [ -n "${comment_id}" ]; then
            echo "Updating existing comment id=${comment_id}"
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              -F "body=@${REPORT}" > /dev/null
          else
            echo "Creating new comment"
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F "body=@${REPORT}" > /dev/null
          fi

          echo "Comment published successfully on PR #${PR_NUMBER}"
