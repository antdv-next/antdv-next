name: Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}

    steps:
      - id: check
        name: Skip push if branch has open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="${GITHUB_REF_NAME}"

          PR_COUNT=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          echo "Branch: $BRANCH"
          echo "Open PR count: $PR_COUNT"

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: ${{ needs.check.outputs.should-run == 'true' }}
    name: test (${{ matrix.project }} ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [antdv-next, cssinjs]
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm exec vitest run --project=${{ matrix.project }} --reporter=blob --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          VITEST_BLOB_LABEL: ${{ matrix.project }}-${{ matrix.shardIndex }}

      - name: Upload Vitest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results-${{ matrix.project }}-${{ matrix.shardIndex }}
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1

  merge-reports:
    needs: [check, test]
    if: ${{ always() && !cancelled() && needs.check.outputs.should-run == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Vitest results
        uses: actions/download-artifact@v4
        with:
          path: .vitest-reports
          pattern: vitest-results-*
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec vitest --merge-reports .vitest-reports --reporter=default --reporter=github-actions
