name: Test

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip push if branch has open PR
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          echo "Checking open PRs for branch: $BRANCH"

          PR_COUNT=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          echo "Open PR count: $PR_COUNT"

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "Open PR exists for this branch. Skipping push workflow."
            exit 0
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
