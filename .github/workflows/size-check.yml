name: Size Report (Compute)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/antdv-next/src/**/*.ts'
      - 'packages/antdv-next/src/**/*.tsx'
      - 'packages/antdv-next/src/**/*.css'
      - '!packages/antdv-next/src/**/tests/**'
      - '!packages/antdv-next/src/**/__snapshots__/**'
      - '!packages/antdv-next/src/**/locale/**'

permissions:
  contents: read

concurrency:
  group: size-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Package size report
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Build the exact PR head. This also works when the PR comes from a fork.
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Write size measurement script
        run: |
          cat > /tmp/size-report.mjs <<'MEOF'
          import {
            brotliCompressSync,
            constants,
            gzipSync,
          } from 'node:zlib'
          import {
            existsSync,
            readFileSync,
            readdirSync,
            writeFileSync,
          } from 'node:fs'
          import { join, relative, sep } from 'node:path'

          const MAX_COMMENT_BYTES = 60_000
          const TARGET_PACKAGE_NAME = 'antdv-next'
          const IGNORED_BUNDLE_FILES = new Set([
            'antd-with-locales.js',
            'antd-with-locales.esm.js',
          ])
          const [command, firstArg, secondArg, thirdArg] = process.argv.slice(2)

          function isLocaleFile(filePath) {
            const normalized = filePath.split(sep).join('/')
            return /\/locales?\//.test(normalized)
          }

          function isIgnoredBundle(filePath) {
            const normalized = filePath.split(sep).join('/')
            const fileName = normalized.split('/').pop()
            return IGNORED_BUNDLE_FILES.has(fileName)
          }

          function listFiles(dir, files = []) {
            if (!existsSync(dir))
              return files

            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const file = join(dir, entry.name)
              if (entry.isDirectory()) {
                listFiles(file, files)
              }
              else if (
                entry.isFile()
                && /\.(?:js|css)$/.test(entry.name)
                && !isLocaleFile(file)
                && !isIgnoredBundle(file)
              ) {
                files.push(file)
              }
            }

            return files
          }

          function measurePackage(packageDir) {
            const packageJson = JSON.parse(
              readFileSync(join(packageDir, 'package.json'), 'utf8'),
            )
            const files = {}

            for (const file of listFiles(join(packageDir, 'dist')).sort()) {
              const content = readFileSync(file)
              const relativeFile = relative(packageDir, file).split(sep).join('/')
              files[relativeFile] = {
                size: content.length,
                gzip: gzipSync(content, { level: 9, mtime: 0 }).length,
                brotli: brotliCompressSync(content, {
                  params: {
                    [constants.BROTLI_PARAM_QUALITY]: 11,
                  },
                }).length,
              }
            }

            return {
              name: packageJson.name,
              files,
            }
          }

          function measureWorkspace(outputFile) {
            const packages = {}
            if (existsSync('packages')) {
              for (const entry of readdirSync('packages', { withFileTypes: true })) {
                if (!entry.isDirectory())
                  continue

                const packageDir = join('packages', entry.name)
                if (!existsSync(join(packageDir, 'package.json')))
                  continue

                const measured = measurePackage(packageDir)
                if (measured.name !== TARGET_PACKAGE_NAME)
                  continue

                packages[measured.name] = { files: measured.files }
              }
            }

            writeFileSync(outputFile, `${JSON.stringify({ packages }, null, 2)}\n`)
          }

          function formatBytes(value) {
            const units = ['B', 'kB', 'MB', 'GB']
            let amount = value
            let unit = 0

            while (amount >= 1024 && unit < units.length - 1) {
              amount /= 1024
              unit++
            }

            return `${unit === 0 || amount >= 100 ? amount.toFixed(0) : amount.toFixed(1)} ${units[unit]}`
          }

          function formatSignedBytes(value) {
            if (value === 0)
              return '±0 B'
            return `${value > 0 ? '+' : '-'}${formatBytes(Math.abs(value))}`
          }

          function formatCompare(main, pr) {
            if (main === undefined && pr !== undefined)
              return `${formatBytes(pr)} (new)`

            if (main !== undefined && pr === undefined)
              return `${formatBytes(main)} (deleted)`

            if (main === pr)
              return `${formatBytes(pr)} (±0 B)`

            const delta = pr - main
            const rate = main === 0
              ? 'N/A'
              : `${delta > 0 ? '+' : ''}${(delta * 100 / main).toFixed(1)}%`

            return `${formatBytes(main)} → ${formatBytes(pr)} (${formatSignedBytes(delta)}, ${rate})`
          }

          function formatTableRow(fields) {
            const escapedFields = fields.map(field => String(field)
              .replaceAll('|', '\\|')
              .replace(/\r?\n/g, '<br>'))
            return `| ${escapedFields.join(' | ')} |`
          }

          function hasChanged(mainFile, prFile) {
            if (!mainFile || !prFile)
              return Boolean(mainFile || prFile)

            return mainFile.size !== prFile.size
              || mainFile.gzip !== prFile.gzip
              || mainFile.brotli !== prFile.brotli
          }

          function buildReport(main, pr) {
            const lines = ['Size Report', '---', '']
            const packageName = TARGET_PACKAGE_NAME
            const mainFiles = main.packages[packageName]?.files ?? {}
            const prFiles = pr.packages[packageName]?.files ?? {}
            const allFiles = [...new Set([
              ...Object.keys(prFiles),
              ...Object.keys(mainFiles),
            ])].sort()
            const files = allFiles.filter(file => hasChanged(mainFiles[file], prFiles[file]))

            lines.push(`### Package: \`${packageName}\``)
            lines.push('')
            lines.push('| File | Size | Gzip | Brotli |')
            lines.push('| --- | --- | --- | --- |')

            if (files.length === 0) {
              lines.push(formatTableRow([
                'No changed files',
                '—',
                '—',
                '—',
              ]))
            }
            else {
              for (const file of files) {
                const mainFile = mainFiles[file]
                const prFile = prFiles[file]

                lines.push(formatTableRow([
                  file,
                  formatCompare(mainFile?.size, prFile?.size),
                  formatCompare(mainFile?.gzip, prFile?.gzip),
                  formatCompare(mainFile?.brotli, prFile?.brotli),
                ]))
              }
            }

            lines.push('')
            lines.push('<!-- size-report -->')
            return `${lines.join('\n')}\n`
          }

          function writeReport(mainFile, prFile, outputFile) {
            const main = JSON.parse(readFileSync(mainFile, 'utf8'))
            const pr = JSON.parse(readFileSync(prFile, 'utf8'))
            const report = buildReport(main, pr)

            if (Buffer.byteLength(report, 'utf8') > MAX_COMMENT_BYTES)
              throw new Error('Changed file size report is too large to publish as one PR comment')

            writeFileSync(outputFile, report)
          }

          if (command === 'measure') {
            measureWorkspace(firstArg)
          }
          else if (command === 'report') {
            writeReport(firstArg, secondArg, thirdArg)
          }
          else {
            throw new Error('Usage: measure <output.json> or report <main.json> <pr.json> <output.md>')
          }
          MEOF

      - name: Install PR head dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PR head packages
        run: |
          rm -rf packages/*/dist
          pnpm -r --filter "./packages/*" run build

      - name: Measure PR head
        run: node /tmp/size-report.mjs measure /tmp/size-pr.json

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install main dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main packages
        run: |
          rm -rf packages/*/dist
          pnpm -r --filter "./packages/*" run build

      - name: Measure main
        run: node /tmp/size-report.mjs measure /tmp/size-main.json

      - name: Generate PR size report
        run: node /tmp/size-report.mjs report /tmp/size-main.json /tmp/size-pr.json /tmp/size-report.md

      - name: Save PR info
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MAIN_SHA=$(git rev-parse HEAD)
          printf '{"number":%s,"headSha":"%s","mainSha":"%s"}\n' \
            "$PR_NUMBER" "$HEAD_SHA" "$MAIN_SHA" > /tmp/pr-info.json

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: |
            /tmp/size-report.md
            /tmp/pr-info.json
          retention-days: 1
