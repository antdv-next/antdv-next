name: Pkg Size

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pkg-size:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Get npm package size
        id: size
        shell: bash
        run: |
          PACK=$(npm pack ./packages/antdv-next \
            --dry-run \
            --json \
            --ignore-scripts \
            --loglevel=error)

          SIZE=$(jq -r '.[0].size' <<< "$PACK")
          UNPACK_SIZE=$(jq -r '.[0].unpackedSize' <<< "$PACK")

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "unpack_size=$UNPACK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Get base branch size
        if: github.event_name == 'pull_request'
        id: base_size
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout FETCH_HEAD -- . 2>/dev/null || true

          pnpm install --frozen-lockfile
          pnpm build

          PACK=$(npm pack ./packages/antdv-next \
            --dry-run \
            --json \
            --ignore-scripts \
            --loglevel=error)

          SIZE=$(jq -r '.[0].size' <<< "$PACK")
          UNPACK_SIZE=$(jq -r '.[0].unpackedSize' <<< "$PACK")

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "unpack_size=$UNPACK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const run = require('./scripts/pkg-size-comment.cjs');
            await run({
              github,
              context,
              size: parseInt('${{ steps.size.outputs.size }}'),
              unpackSize: parseInt('${{ steps.size.outputs.unpack_size }}'),
              baseSize: parseInt('${{ steps.base_size.outputs.size }}') || parseInt('${{ steps.size.outputs.size }}'),
              baseUnpackSize: parseInt('${{ steps.base_size.outputs.unpack_size }}') || parseInt('${{ steps.size.outputs.unpack_size }}'),
            });