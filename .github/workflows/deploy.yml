name: deploy-site

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

# Only runs that will actually deploy (Test triggered by a push to main) share
# the `deploy-site-main` group. Every other Test completion (tags, PRs, other
# branches) starts a run that is skipped below; giving those their own group
# keeps them from cancelling a deployment in progress. A release pushes main
# and a tag together, and the tag's Test run used to cancel the main deploy.
concurrency:
  group: ${{ (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') && 'deploy-site-main' || format('deploy-site-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    # Test 绿 + push 到 main 分支才部署
    # （限定 push 事件：来自 fork 的 PR，其 head_branch 也可能叫 main）
    if: >
      ${{
        github.repository == 'antdv-next/antdv-next' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # 确保部署的是“通过测试的那次提交”
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: |
          pnpm build
          rm -rf dist
          cp -r docs/dist dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Inspect downloaded site artifact
        run: ls -R dist

      - name: Scp dir to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: dist
          target: ${{ secrets.DEPLOY_TARGET_PATH }}

      - name: ssh command
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            TARGET="${{ secrets.DEPLOY_TARGET_PATH }}"

            mkdir -p "$TARGET/index" "$TARGET/index.bak"

            if [ "$(ls -A "$TARGET/index" 2>/dev/null)" ]; then
              rm -rf "$TARGET/index.bak"/*
              mv "$TARGET/index"/* "$TARGET/index.bak"/
            fi

            if [ ! -d "$TARGET/dist" ] || [ -z "$(ls -A "$TARGET/dist" 2>/dev/null)" ]; then
              echo "No dist files uploaded; abort."
              exit 1
            fi

            rm -rf "$TARGET/index"/*
            mv "$TARGET/dist"/* "$TARGET/index"/

      - name: Deployment completed
        run: echo "Deployment to server completed successfully."

  deploy-cn:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Inspect downloaded site artifact
        run: ls -R dist

      - name: Scp dir to CN server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_CN }}
          username: ${{ secrets.DEPLOY_USERNAME_CN }}
          password: ${{ secrets.DEPLOY_PASSWORD_CN }}
          port: ${{ secrets.DEPLOY_PORT_CN }}
          source: dist
          target: ${{ secrets.DEPLOY_TARGET_PATH_CN }}

      - name: ssh command on CN server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST_CN }}
          username: ${{ secrets.DEPLOY_USERNAME_CN }}
          password: ${{ secrets.DEPLOY_PASSWORD_CN }}
          port: ${{ secrets.DEPLOY_PORT_CN }}
          script: |
            set -e
            TARGET="${{ secrets.DEPLOY_TARGET_PATH_CN }}"

            mkdir -p "$TARGET/index" "$TARGET/index.bak"

            if [ "$(ls -A "$TARGET/index" 2>/dev/null)" ]; then
              rm -rf "$TARGET/index.bak"/*
              mv "$TARGET/index"/* "$TARGET/index.bak"/
            fi

            if [ ! -d "$TARGET/dist" ] || [ -z "$(ls -A "$TARGET/dist" 2>/dev/null)" ]; then
              echo "No dist files uploaded; abort."
              exit 1
            fi

            rm -rf "$TARGET/index"/*
            mv "$TARGET/dist"/* "$TARGET/index"/

      - name: Deployment completed on CN server
        run: echo "Deployment to CN server completed successfully."
